<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<meta name="theme-color" content="#241f38" />
<title>for Ammushh</title>
<meta name="description" content="a tiny thing, made at midnight." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <div id="bg" aria-hidden="true">
    <div id="stars"></div>
    <div id="orb"></div>
  </div>

  <div id="progress-rail" aria-hidden="true"><div id="progress-fill"></div></div>

  <div id="scroll-hint" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>scroll</span>
  </div>

  <button id="music-toggle" type="button" aria-pressed="false" aria-label="Play soft music">
    <svg id="icon-note" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M9 18V5.6c0-.4.28-.75.68-.85l8-2A.88.88 0 0 1 18.75 3.6v11.1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="7" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="16.25" cy="16.2" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
    </svg>
    <svg id="icon-pause" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" class="icon-hidden">
      <rect x="7" y="5" width="3.4" height="14" rx="1.2" fill="currentColor"/>
      <rect x="13.6" y="5" width="3.4" height="14" rx="1.2" fill="currentColor"/>
    </svg>
  </button>

  <main id="story">

    <!-- Chapter 1 — Pre-dawn -->
    <section class="chapter len-s tone-light" id="ch1" data-chapter="1" data-sticky="true">
      <div class="scene">
        <div class="scene-inner">
          <p class="beat beat-lg" id="c1-line1"></p>
          <p class="beat" id="c1-line2"></p>
        </div>
      </div>
    </section>

    <!-- Chapter 2 — The call -->
    <section class="chapter len-l tone-light" id="ch2" data-chapter="2" data-sticky="true">
      <div class="scene">
        <div class="scene-inner">
          <p class="beat" id="c2-b1"></p>
          <p class="beat" id="c2-b2"></p>
          <p class="beat" id="c2-b3"></p>
          <p class="beat" id="c2-b4"></p>
        </div>
      </div>
    </section>

    <!-- Chapter 3 — The realization -->
    <section class="chapter len-xl tone-light" id="ch3" data-chapter="3" data-sticky="true">
      <div class="scene">
        <div class="scene-inner">
          <p class="beat beat-emph" id="c3-b1"></p>
          <p class="beat" id="c3-b2"></p>
          <p class="beat" id="c3-b3"></p>
          <p class="beat" id="c3-b4"></p>
          <p class="beat" id="c3-b5"></p>
        </div>
      </div>
    </section>

    <!-- Chapter 4 — Missing-you meter -->
    <section class="chapter len-l tone-light" id="ch4" data-chapter="4" data-sticky="true">
      <div class="scene">
        <div class="scene-inner">
          <p class="beat meter-title" id="c4-title"></p>

          <div class="scanner-wrap" id="scanner-wrap">
            <button class="scanner-pad" id="scanner-pad" type="button" aria-label="Press and hold to check">
              <div class="meter-glow" id="meter-glow" aria-hidden="true"></div>
              <div class="meter-plate" aria-hidden="true"></div>
              <svg class="meter-ring" viewBox="0 0 120 120" aria-hidden="true">
                <defs>
                  <linearGradient id="meterGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#f3a58a" />
                    <stop offset="100%" stop-color="#e8b23f" />
                  </linearGradient>
                </defs>
                <circle class="meter-ring-track" cx="60" cy="60" r="54" />
                <circle class="meter-ring-fill" id="meter-ring-fill" cx="60" cy="60" r="54" />
              </svg>
              <div class="scanner-sweep" id="scanner-sweep" aria-hidden="true"></div>
              <svg class="scanner-thumb" id="scanner-thumb" viewBox="0 0 48 48" aria-hidden="true">
                <path d="M24 6c8 0 15 6.4 15 15.4V30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M24 11.5c5.6 0 10.2 4.4 10.2 10v6.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M24 17c3 0 5.6 2.4 5.6 5.6V33c0 3.6-2.7 6.6-6.2 6.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M13 21.4C13 12.4 20 6 24 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M13.8 22v9.2c0 5 2.7 8.7 6.4 10.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <path d="M18.6 22.3v7.9c0 3.6 2 6.3 5 7.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
              <div class="meter-number" id="meter-number">0%</div>
              <svg class="scanner-check" id="scanner-check" viewBox="0 0 48 48" aria-hidden="true">
                <circle cx="24" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="2" opacity=".5"/>
                <path d="M15 24.5l6 6 12-13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <p class="scanner-hint" id="scanner-hint"></p>
          </div>

          <div class="report-card" id="report-card">
            <p class="report-status" id="report-status"></p>
            <p class="report-headline" id="report-headline"></p>
            <div class="report-row">
              <span class="report-label" id="report-label"></span>
              <span class="report-value">100%</span>
            </div>
          </div>

          <p class="beat" id="c4-medicine"></p>
        </div>
      </div>
    </section>

    <!-- Chapter 5 — The hug -->
    <section class="chapter len-m tone-light" id="ch5" data-chapter="5" data-sticky="true">
      <div class="scene">
        <div class="scene-inner">
          <p class="beat" id="c5-b1"></p>
          <div class="hug-orbs" id="hug-orbs" aria-hidden="true">
            <div class="hug-orb hug-orb--a" id="hug-orb-a">
              <div class="hug-flip">
                <svg class="hug-char" viewBox="0 0 100 110">
                  <defs>
                    <linearGradient id="hugGradA" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stop-color="#ffe3b0" />
                      <stop offset="100%" stop-color="#ffbf72" />
                    </linearGradient>
                  </defs>
                  <ellipse class="hug-arm" cx="82" cy="66" rx="17" ry="9.5" fill="url(#hugGradA)" />
                  <ellipse cx="48" cy="62" rx="32" ry="34" fill="url(#hugGradA)" />
                  <circle cx="24" cy="26" r="13" fill="url(#hugGradA)" />
                  <circle cx="72" cy="26" r="13" fill="url(#hugGradA)" />
                  <circle cx="24" cy="26" r="6" fill="#fff" opacity=".4" />
                  <circle cx="72" cy="26" r="6" fill="#fff" opacity=".4" />
                  <path d="M34 58q7 7 14 0" stroke="#6b4530" stroke-width="2.4" fill="none" stroke-linecap="round" />
                  <path d="M56 58q7 7 14 0" stroke="#6b4530" stroke-width="2.4" fill="none" stroke-linecap="round" />
                  <path d="M43 73.5q5 4.5 10 0" stroke="#6b4530" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".55" />
                  <circle cx="30" cy="72" r="5" fill="#fff" opacity=".3" />
                  <circle cx="66" cy="72" r="5" fill="#fff" opacity=".3" />
                </svg>
              </div>
            </div>
            <div class="hug-orb hug-orb--b" id="hug-orb-b">
              <div class="hug-flip">
                <svg class="hug-char" viewBox="0 0 100 110">
                  <defs>
                    <linearGradient id="hugGradB" x1="0" y1="0" x2="1" y2="1">
                      <stop offset="0%" stop-color="#ffd7d0" />
                      <stop offset="100%" stop-color="#ff9e8f" />
                    </linearGradient>
                  </defs>
                  <ellipse class="hug-arm" cx="82" cy="66" rx="17" ry="9.5" fill="url(#hugGradB)" />
                  <ellipse cx="48" cy="62" rx="32" ry="34" fill="url(#hugGradB)" />
                  <circle cx="24" cy="26" r="13" fill="url(#hugGradB)" />
                  <circle cx="72" cy="26" r="13" fill="url(#hugGradB)" />
                  <circle cx="24" cy="26" r="6" fill="#fff" opacity=".4" />
                  <circle cx="72" cy="26" r="6" fill="#fff" opacity=".4" />
                  <path d="M34 58q7 7 14 0" stroke="#6b4530" stroke-width="2.4" fill="none" stroke-linecap="round" />
                  <path d="M56 58q7 7 14 0" stroke="#6b4530" stroke-width="2.4" fill="none" stroke-linecap="round" />
                  <path d="M43 73.5q5 4.5 10 0" stroke="#6b4530" stroke-width="1.8" fill="none" stroke-linecap="round" opacity=".55" />
                  <circle cx="30" cy="72" r="5" fill="#fff" opacity=".3" />
                  <circle cx="66" cy="72" r="5" fill="#fff" opacity=".3" />
                </svg>
              </div>
            </div>
            <div class="hug-burst" aria-hidden="true">
              <span style="--bx:-22px; --by:-30px;"></span>
              <span style="--bx:24px; --by:-34px;"></span>
              <span style="--bx:0px; --by:-42px;"></span>
              <span style="--bx:-34px; --by:-8px;"></span>
              <span style="--bx:34px; --by:-10px;"></span>
            </div>
          </div>
          <p class="beat" id="c5-b2"></p>
          <div class="hug-particles" id="hug-particles" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <!-- Chapter 6 — Night becomes morning (pure atmosphere, no content) -->
    <section class="chapter len-xxl" id="ch6" data-chapter="6" aria-hidden="true"></section>

    <!-- Chapter 7 — Morning -->
    <section class="chapter len-morning tone-warm" id="ch7" data-chapter="7" data-sticky="true">
      <div class="scene">
        <div class="scene-inner">
          <p class="beat" id="c7-b1"></p>
          <p class="beat" id="c7-b2"></p>
          <p class="beat" id="c7-b3"></p>
          <p class="beat" id="c7-b4"></p>
          <p class="beat" id="c7-b5"></p>
          <p class="beat beat-emph" id="c7-b6"></p>
        </div>
      </div>
    </section>

    <!-- Chapter 8 — Final love note (editorial, normal flow) -->
    <section class="chapter chapter--flow tone-warm" id="ch8" data-chapter="8">
      <div class="letter">
        <h2 class="letter-heading reveal" id="letter-heading"></h2>
        <div class="letter-body" id="letter-body"></div>
      </div>
    </section>

    <!-- Chapter 9 — Final sunrise -->
    <section class="chapter len-m tone-warm" id="ch9" data-chapter="9" data-sticky="true">
      <div class="scene">
        <div class="scene-inner">
          <h1 class="beat beat-lg" id="c9-b1"></h1>
          <p class="beat" id="c9-b2"></p>
          <p class="beat" id="c9-b3"></p>
        </div>
        <p class="signature reveal" id="finale-signature"></p>
        <button class="restart-link reveal" type="button" id="restart-btn"></button>
      </div>
    </section>

  </main>

  <div id="sr-status" class="sr-only" role="status" aria-live="polite"></div>

  <audio id="bg-audio" loop preload="none">
    <source src="./assets/music.mp3" type="audio/mpeg" />
  </audio>

  <script src="./script.js"></script>
</body>
</html>
